# NeoEduCore — entorno local con un solo comando:
#
#     docker compose up --build
#
# Levanta Postgres + las TRES instancias de producción: API (8100), WebSocket (8180)
# y worker de cola, usando el
# Dockerfile existente. NO toca la Supabase del .env: la base es local y propia.
# Lo único que se lee del .env de la raíz es APP_KEY (y opcionalmente OPENAI_API_KEY).
#
# Primera vez, con la API arriba:
#     docker compose exec app php artisan migrate --force
#
# Apagar:  docker compose down        (añadir -v para borrar también la base)

x-app: &app
  build: .
  environment: &app-env
    APP_ENV: local
    APP_DEBUG: "true"
    APP_KEY: ${APP_KEY:?define APP_KEY en el .env (php artisan key:generate --show)}
    APP_URL: http://localhost:8100
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: neoeducore
    DB_USERNAME: neoeducore
    DB_PASSWORD: neoeducore
    QUEUE_CONNECTION: database
    CACHE_STORE: file
    SESSION_DRIVER: database
    MAIL_MAILER: log
    # Reverb: las claves son solo de desarrollo. Los navegadores se conectan a
    # localhost:8180; app y worker publican por la red interna (websocket:8180).
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: neoeducore
    REVERB_APP_KEY: ${REVERB_APP_KEY:-local-dev-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-local-dev-secret}
    REVERB_HOST: localhost
    REVERB_PORT: 8180
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8180
    REVERB_PUBLISH_HOST: websocket
    REVERB_PUBLISH_PORT: 8180
    REVERB_PUBLISH_SCHEME: http
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "8100:8100"

  # Instancia 2: WebSocket (Laravel Reverb). Mismo código, otro comando.
  websocket:
    <<: *app
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8180", "--no-interaction"]
    ports:
      - "8180:8180"

  # Instancia 3: worker. Manda correos, procesa la carga masiva y publica los eventos.
  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--queue=default,correos", "--tries=3"]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neoeducore
      POSTGRES_USER: neoeducore
      POSTGRES_PASSWORD: neoeducore
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoeducore -d neoeducore"]
      interval: 3s
      retries: 20

volumes:
  dbdata:
